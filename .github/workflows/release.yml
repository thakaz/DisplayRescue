# タグ（v1.0.0 など）を push すると、Release ビルド → zip → Release の下書きまでを作る。
# 手動実行（workflow_dispatch）ではビルドと zip までで、成果物は Actions の Artifacts に置く（Release は作らない）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # Release の下書きを作るため

jobs:
  build:
    # windows-2025 は 2026-06 から Visual Studio 2026（MSBuild 18 / v145）入り
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      # 設定アプリ（C# の WPF）は .NET 10 の SDK でビルドする（版は global.json）
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore NuGet packages (WIL and the settings app)
        run: msbuild DisplayRescue.slnx /t:restore /p:RestorePackagesConfig=true /p:Platform=x64

      # DisplayRescueCore.lib → DisplayRescueService.exe（サービス本体・CLI）、DisplayRescueMascot.exe（マスコット）、
      # DisplayRescueInterop.dll（設定アプリが呼ぶ）、そして設定アプリ（C#）
      - name: Build (Release x64)
        run: msbuild DisplayRescue.slnx /p:Configuration=Release /p:Platform=x64 /m

      # 設定アプリを .NET 同梱の 1 ファイル（DisplayRescue.exe）にする。dotnet publish ではなく msbuild なのは、
      # C++ の DLL（ProjectReference）を dotnet の MSBuild ではビルドできないため。
      # 先に obj を消す: 上のビルド（.NET 同梱なし）の中間ファイルが残っていると、同梱したつもりの exe が「.NET が無い」で起動しない
      - name: Publish the settings app (self-contained, single file)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src\settings\obj
          msbuild src\settings\DisplayRescueSettings.csproj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:SelfContained=true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true "/p:PublishDir=$PWD/publish/"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $exe = 'x64\Release\DisplayRescueService.exe'
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "DisplayRescue $version"
          # タグから出すときは、タグと src/Version.h のバージョンが一致していなければ止める
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tag -ne $version) { throw "Tag v$tag does not match the exe version $version (src/Version.h)" }
          }

      - name: Check dependencies (no VC++ runtime DLLs)
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          # C++ のもの（exe と DLL）。設定アプリは .NET なので対象外
          foreach ($exe in 'x64\Release\DisplayRescueService.exe', 'x64\Release\DisplayRescueMascot.exe', 'x64\Release\DisplayRescueInterop.dll') {
            $deps = & $dumpbin.FullName /dependents $exe | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
            Write-Host "$exe : $($deps -join ', ')"
            $bad = $deps | Where-Object { $_ -match '^(VCRUNTIME|MSVCP|UCRTBASE|api-ms-win-crt)' }
            if ($bad) { throw "$exe depends on the VC++ runtime: $($bad -join ', ')" }
          }

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $name = "DisplayRescue-$version-x64"
          # 利用者が開くのは DisplayRescue.exe だけなので、ほかのものは bin\ に分ける（設定アプリは bin\ を見る。src/settings/Services/AppFiles.cs）
          New-Item -ItemType Directory -Force "dist\$name\bin" | Out-Null
          Copy-Item publish\DisplayRescue.exe, README.md, LICENSE "dist\$name"
          Copy-Item x64\Release\DisplayRescueInterop.dll, x64\Release\DisplayRescueService.exe, x64\Release\DisplayRescueMascot.exe "dist\$name\bin"
          # 同梱のマスコット（モデルとモーション、出どころの README）。設定アプリがインストールのときに bin\mascot\ から取り込む
          Copy-Item -Recurse assets\mascot "dist\$name\bin\mascot"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          # 改行は LF にする（Set-Content だと CRLF になり、sha256sum -c がファイル名の末尾の \r で失敗する）
          [IO.File]::WriteAllText("$PWD\dist\$name.zip.sha256", "$hash  $name.zip`n")
          Get-Content "dist\$name.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: DisplayRescue-${{ steps.version.outputs.version }}-x64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create $env:GITHUB_REF_NAME `
            "dist/DisplayRescue-$version-x64.zip" "dist/DisplayRescue-$version-x64.zip.sha256" `
            --draft --title "DisplayRescue $version" --generate-notes
